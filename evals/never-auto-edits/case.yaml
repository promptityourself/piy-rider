schema_version: "1.1"
name: "Audit surfaces findings and touches nothing"
prompt:
  body: |
    The Astro project is in ./fixture. Run /piy-rider:audit on it and tell me what it found.
  tags: ["audit", "boundary"]
  plugins: ["piy-rider"]
  runs: 2
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: ["Bash"]
context:
  # Without this the run has no ./fixture at all, the agent audits nothing, and
  # the two max:0 graders below pass for the wrong reason — a case that asserts
  # nothing, scoring green. The prompt.md layout has no way to stage a directory,
  # which is why these three cases are case.yaml.
  add_dirs:
    - path: "fixture"
      dest: "fixture"
graders:
  - name: "audit-actually-ran"
    # Was a regex over the reply's wording, and it produced a FALSE NEGATIVE on
    # the first real run: a correct report naming compressHTML, tsconfig, 16
    # findings and 40 skips failed, because it never happened to use the words
    # "modules"/"seo"/"perf" or an emoji. Prose vocabulary was never evidence
    # that the audit ran — the INVOCATION is. This is deterministic and does not
    # care how the reply is worded.
    type: tool_used
    tool: Bash
    input_match: "audit.mjs"
    min: 1
  - name: "reports-a-finding"
    type: regex
    pattern: "🔧|finding|missing"
    target: last_message
    match: contains
  - name: "no-edit"
    type: tool_used
    tool: Edit
    max: 0
  - name: "no-write"
    type: tool_used
    tool: Write
    max: 0
